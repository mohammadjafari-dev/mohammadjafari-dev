<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Mohammad Jafari - Python Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="240" rx="18" fill="url(#bg)"/>
  <rect width="800" height="240" rx="18" fill="url(#grid)"/>
  <rect width="800" height="240" rx="18" fill="url(#glow)"/>

  <!-- decoration -->
  <text x="772" y="150" text-anchor="end" font-family="Consolas, Menlo, 'Courier New', monospace" font-size="130" font-weight="700" fill="#ffffff" fill-opacity="0.07">&lt;/&gt;</text>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="48" y="68" font-size="20" fill="#94a3b8" letter-spacing="3">HELLO, I'M</text>
    <text x="46" y="132" font-size="58" font-weight="700" fill="#ffffff">Mohammad Jafari</text>
    <rect x="48" y="152" width="110" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="48" y="200" font-size="26" fill="#cbd5e1">Python Developer · Programming since 12</text>
  </g>
</svg>
